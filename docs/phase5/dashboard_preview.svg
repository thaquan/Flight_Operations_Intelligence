<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Flight Operations Intelligence Executive Overview dashboard theme preview">
  <title>Flight Operations Intelligence — M5.1 Executive Overview concept</title>
  <desc>Preview of a proposed light aviation operations dashboard with a dark navigation rail, five KPI cards, 2024 and 2025 annual delay comparison, operational outcome mix, and quality notes. All displayed numbers are sourced from verified Phase 3 and 4 summaries; this is not a working Power BI report.</desc>
