name: Data quality CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and dbt smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: flight_ci
          POSTGRES_USER: flight_ci
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flight_ci -d flight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: flight_ci
      POSTGRES_USER: flight_ci
      POSTGRES_PASSWORD: ${{ github.run_id }}
      FLIGHT_CI_FIXTURE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-phase2.txt
            requirements-phase3.txt
            requirements-phase4.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-phase2.txt -r requirements-phase3.txt -r requirements-phase4.txt

      - name: Lint quality, BI and benchmark Python code
        run: >-
          ruff check --select E4,E7,E9,F,I
          src/phase4 src/phase5 src/phase8
          tests/test_phase4_quality_gates.py tests/test_phase4_ci_workflow.py
          tests/test_phase5_*.py tests/test_phase8_benchmark.py

      - name: Run Python tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Seed isolated synthetic Silver dataset
        run: python -m src.phase4.ci_fixture setup

      - name: Build and test full dbt DAG on synthetic data
        run: dbt build --project-dir dbt --profiles-dir dbt --threads 2

      - name: Verify synthetic KPIs and transaction recovery
        run: python -m src.phase4.ci_fixture verify

      - name: Run source-to-mart quality gates
        run: python -m src.phase4.quality_gates --mode fixture
