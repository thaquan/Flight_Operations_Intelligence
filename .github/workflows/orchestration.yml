name: Dagster orchestration CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-phase7.txt
      - run: python -m pip install -r requirements-phase7.txt
      - run: python -m pip check
      - run: python -m pytest -q tests/test_phase7_orchestration.py
